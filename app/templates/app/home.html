<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
<h1 class="bg-primary text-white p-5 text-center">Employee Database Mangement System Capstone Project-1</h1>
<table class="table table-bordered border-danger table-hover">
<thead>
<tr>
<th>SNO</th>
<th>Full Name</th>
<th>Designation</th>
<th>Phone Number</th>
</tr>
</thead>
<tbody>
{% for x in employees %}
<tr>
<td>{{x.id}}</td>
<td><a href="{% url 'employee_detail' x.id %}">{{x.First_name}} {{x.Last_name}}</a></td>
<td>{{x.Designation}}</td>
<td>{{x.Phone_number}}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</body>
</html>
